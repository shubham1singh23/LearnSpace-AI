name: Workspace CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: learnspace
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: learnspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnspace -d learnspace_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://learnspace:ci-only-password@127.0.0.1:5432/learnspace_test?schema=public
      TEST_DATABASE_URL: postgresql://learnspace:ci-only-password@127.0.0.1:5432/learnspace_test?schema=public
      NODE_ENV: test
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
      LEARNSPACE_TEXT_PROVIDER: ''
      LEARNSPACE_TEXT_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Apply migrations from an empty PostgreSQL database
        run: npm run db:migrate
      - name: Verify deploy is repeatable
        run: npm run db:migrate && npm run db:status
      - name: Seed twice without generating lessons
        run: npm run db:seed && npm run db:seed
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
